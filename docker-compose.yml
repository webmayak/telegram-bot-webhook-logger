services:
  telegram-webhook-inbox:
    build: .
    env_file:
      - .env
    environment:
      DB_PATH: /data/telegram_webhooks.sqlite3
      HOST: 0.0.0.0
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - telegram-webhook-data:/data
    restart: unless-stopped

volumes:
  telegram-webhook-data:
